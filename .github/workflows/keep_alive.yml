name: Render Backend Keep-Alive

on:
  schedule:
    # Se ejecuta cada 12 minutos para evitar la hibernación de Render (límite de 15 minutos)
    - cron: "*/12 * * * *"
  workflow_dispatch: # Permite probar el ping manualmente desde la pestaña Actions en GitHub

jobs:
  ping-render:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          URL="https://catalogo-vr.onrender.com/health"
          echo "Pinging Render backend: $URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "HTTP Status Code: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Render backend is alive and responding OK!"
          else
            echo "Backend responded with status $STATUS_CODE, but container was pinged."
          fi
