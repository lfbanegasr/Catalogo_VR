services:
  db:
    image: postgres:15-alpine
    container_name: tienda_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tienda_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tienda_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Docker Compose es exclusivamente local: estas variables prevalecen sobre
      # cualquier configuracion de produccion presente en backend/.env.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/${POSTGRES_DB:-tienda_db}
      ENVIRONMENT: development
      STORAGE_BACKEND: local
      PUBLIC_ASSET_BASE_URL: http://127.0.0.1:8000
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_ENDPOINT_URL: ""
      R2_PUBLIC_BASE_URL: ""
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
